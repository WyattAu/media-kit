# NOTE: intentionally NOT calling the shared engineering-standards workflow
# (tier b): its unconditional `cargo check --no-default-features` step fails
# here BY DESIGN — the crate compile_error!s unless at least one decode
# format is enabled. The check-no-default job below pins --features jpeg
# instead. All other shared gates (fmt, clippy -D warnings, all-features
# check/test) are covered by the jobs below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (all-features)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # all-features enables avif via ravif (default-features = false, so no
      # nasm needed) and webp-lossy (bundled libwebp, needs only a C compiler).
      - run: cargo check --all-features

  check-no-default:
    name: Check (no-default-features + jpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A bare --no-default-features build fails by design: the crate
      # compile_error!s unless at least one decode format is enabled.
      - run: cargo check --no-default-features --features jpeg

  test:
    name: Test (all-features)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings
