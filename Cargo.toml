[package]
name = "media-kit"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Full image pipeline — sniff, meta, resize, encode, composite, variants with bomb-guard and async support"
repository = "https://github.com/WyattAu/media-kit"
readme = "README.md"
keywords = ["image", "thumbnail", "pipeline", "webp", "avif"]
categories = ["multimedia::images"]
exclude = ["/target"]

[dependencies]
image = { version = "0.25", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
webp = { version = "0.3", optional = true }
kamadak-exif = { version = "0.5", optional = true, default-features = false }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
tokio = { version = "1", features = ["full"] }

[features]
default = ["std", "jpeg", "png", "gif", "webp"]
std = ["thiserror/std"]
jpeg = ["image/jpeg"]
png = ["image/png"]
gif = ["image/gif"]
webp = ["image/webp"]
webp-lossy = ["dep:webp"]
avif = ["image/avif"]
exif = ["dep:kamadak-exif"]
fast-resize = []
async = ["dep:tokio"]
serde = ["dep:serde", "dep:serde_json"]
full = ["serde", "exif", "avif", "webp-lossy", "fast-resize", "async"]

[[bench]]
name = "pipeline"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# kamadak-exif is used as `exif::` (renamed lib) in src/exif.rs; machete
# cannot see the rename.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif"]
