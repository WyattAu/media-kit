[package]
name = "media-kit"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Full image pipeline — sniff, meta, resize, encode, composite, variants with bomb-guard and async support"
repository = "https://github.com/WyattAu/media-kit"
readme = "README.md"
keywords = ["image", "thumbnail", "pipeline", "webp", "avif"]
categories = ["multimedia::images"]
exclude = ["/target"]

[dependencies]
image = { version = "0.25", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
webp = { version = "0.3", optional = true }
kamadak-exif = { version = "0.6", optional = true, default-features = false }
tokio = { version = "1", features = ["rt"], optional = true }
rayon = { version = "1.10", optional = true }
fast_image_resize = { version = "6.1", optional = true, default-features = false, features = [
    "std",
    "image",
] }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
tokio = { version = "1", features = ["full"] }
# Deterministic CI perf gate (instruction counts; needs valgrind to run).
iai-callgrind = "0.16"

[features]
default = ["std", "jpeg", "png", "gif", "webp", "exif", "parallel"]
std = ["thiserror/std"]
jpeg = ["image/jpeg"]
png = ["image/png"]
gif = ["image/gif"]
webp = ["image/webp"]
webp-lossy = ["dep:webp"]
avif = ["image/avif"]
exif = ["dep:kamadak-exif"]
fast-resize = ["dep:fast_image_resize"]
parallel = ["dep:rayon"]
async = ["dep:tokio"]
serde = ["dep:serde", "dep:serde_json"]
full = ["serde", "exif", "avif", "webp-lossy", "fast-resize", "parallel", "async"]

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "resize_backends"
harness = false

[[bench]]
name = "parallel"
harness = false

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_hot_path.rs.
[[bench]]
name = "iai_hot_path"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# kamadak-exif is used as `exif::` (renamed lib) in src/exif.rs; machete
# cannot see the rename.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif"]
